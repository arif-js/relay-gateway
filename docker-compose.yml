# relay-gateway — a small deployment.
#
#   cp relay.env.example relay.env   # then edit it
#   docker compose up -d
#
# The domain in front of it is yours to set: point a Cloudflare DNS record at
# this host and put Caddy (or anything else that terminates TLS) in front of
# port 8787.

services:
  relay:
    build: .
    image: relay-gateway
    restart: unless-stopped
    env_file:
      - relay.env
    volumes:
      - relay-data:/data
    ports:
      # Bound to localhost. Put a reverse proxy in front of it.
      - '127.0.0.1:8787:8787'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  relay-data:
